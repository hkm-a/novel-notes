[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "novel-notes"
version = "0.2.0"
description = "TXT 小说按章节自动生成结构化读书笔记"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "note" }]
dependencies = [
    "requests>=2.31",
    "charset-normalizer>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
novel-notes = "novel_notes.cli:main"
novel-notes-web = "novel_notes.web:main"

[tool.setuptools.packages.find]
include = ["novel_notes*"]

[tool.setuptools.package-data]
novel_notes = ["static/*"]
